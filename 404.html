<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Maringá Casas</title>
  <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f6f2;
      color: #17211d;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    main {
      max-width: 440px;
      text-align: center;
      background: #fff;
      border: 1px solid #e6e4dd;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 12px 32px rgba(23, 33, 29, 0.06);
    }
    .code {
      font-family: "Fraunces", Georgia, serif;
      font-size: 64px;
      line-height: 1;
      color: #1b5e43;
      margin: 0 0 12px;
    }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #5a6b64; margin: 0 0 24px; line-height: 1.55; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      background: #1b5e43;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    a:hover { background: #144732; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Endereço não encontrado</h1>
    <p>Essa rua não está no mapa. Volte para a página inicial para explorar as casas em Maringá.</p>
    <a href="./">← Voltar para o mapa</a>
  </main>
</body>
</html>
